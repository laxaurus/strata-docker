# Strata on AMD ROCm. The image compiles the gfx1100 engine at build time; the
# container runs docker-entrypoint.sh, which sets the model up once (using the
# GGUF files you mount in ./data) and then serves. `docker logs -f strata`
# shows the server output.
#
# Change the model/context/vision with the env vars below (or a .env file).
#
# IQ3_XXS shards (~77 GB total) live in ./data/IQ3_XXS. Fetch them once with:
#   hf download ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF \
#     --include "IQ3_XXS/*" --local-dir ./data
#
# Max tokens (issue #545): entrypoint.sh pins "fit_max_tokens": true in the model
# config and writes {"max_tokens": MAX_TOKENS} to strata-<model>.shared-settings.json
# (in /data/config and beside the /opt/strata config the server is started with), so
# coding CLI requests that omit max_tokens get 22000 and oversized ones are shortened
# to the room left instead of failing with a 400. Clients that send their own
# max_tokens are not capped - the server only clamps to the room left.

services:
  strata:
    build:
      context: .
      dockerfile: dockerfile
    image: strata-rocm:7.2.4
    container_name: strata-qwen-IQ3_XXS
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    security_opt:
      - seccomp=unconfined
    ipc: host            # Strata pins large amounts of RAM; avoid shm limits
    ports:
      - 8088:8080
    volumes:
      - ./data:/data             # model shards + pack + MTP + config live here
      - ./entrypoint.sh:/opt/strata/entrypoint.sh:ro
    entrypoint: ["sh", "/opt/strata/entrypoint.sh"]
    environment:
      FAMILY: qwen
      MODEL: IQ3_XXS
      MAX_TOKENS: 22000          # shared-settings default + fit_max_tokens clamp (issue #545)
      CONTEXT: 131072
      VISION: "none"             # AMD/HIP has no GPU image encoder; CPU encoder (Linux-only)
      KV: int8              # IQ3_XXS needs ~47 GB, fits like the IQ2_XS setup did
      HOST: 0.0.0.0
      PORT: 8080
      LOW_RAM: auto
      GGUF_DIR: /data/IQ3_XXS
      REINSTALL: 1
      # API_KEY: put-a-secret-here   # set before exposing the port to a network
